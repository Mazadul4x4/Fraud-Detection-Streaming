# Continuous integration: runs on every push to main and on every pull request.
# Three independent jobs run in parallel; a pull request shows a green check only if all pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-outdated run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENTLY_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Unit tests (pytest)
        run: python -m pytest -q

  spark-parity:
    name: Spark training/serving parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Spark dependencies
        run: pip install -r requirements-spark.txt
      - name: Spark feature parity test
        run: python -m pytest tests/test_spark_features.py tests/test_card_history.py -q

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t fraud-detection-api:ci -f Dockerfile .
      - name: Build Spark image
        run: docker build -t fraud-detection-spark:ci -f Dockerfile.spark .
